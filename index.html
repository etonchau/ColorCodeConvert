  <script>
    const rawInput = document.getElementById("rawInput");
    const cleanOutput = document.getElementById("cleanOutput");
    const swatchList = document.getElementById("swatchList");
    const swatchCount = document.getElementById("swatchCount");
    const copyBtn = document.getElementById("copyBtn");
    const copyBtnText = document.getElementById("copyBtnText");
    const sampleBtn = document.getElementById("sampleBtn");
    const clearBtn = document.getElementById("clearBtn");

    function rgbToHex(r, g, b) {
      const clamp = (n) => Math.max(0, Math.min(255, Math.round(n)));
      return "#" + [clamp(r), clamp(g), clamp(b)]
        .map((x) => x.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }

    function hexToRgb(hex) {
      let clean = hex.replace(/^#/, "").trim();
      if (clean.length === 3) clean = clean.split("").map((c) => c + c).join("");
      if (!/^[0-9A-Fa-f]{6}$/.test(clean)) return null;
      const num = parseInt(clean, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }

    const SWOP_LUT_3 = [
      [
        [[75, 68, 67, 90], [90, 78, 0, 0],   [88, 77, 0, 0]],
        [[89, 25, 100, 14],[85, 20, 52, 5],  [86, 15, 0, 0]],
        [[81, 0, 100, 0],  [76, 0, 62, 0],   [71, 0, 15, 0]]
      ],
      [
        [[28, 96, 86, 32], [48, 93, 22, 9],  [56, 85, 0, 0]],
        [[37, 45, 92, 19], [52, 43, 44, 7],  [56, 40, 0, 0]],
        [[46, 0, 96, 0],   [48, 0, 54, 0],   [46, 0, 11, 0]]
      ],
      [
        [[0, 99, 100, 0],  [0, 95, 36, 0],   [0, 88, 0, 0]],
        [[0, 62, 95, 0],   [0, 58, 43, 0],   [0, 54, 0, 0]],
        [[3, 0, 93, 0],    [2, 0, 48, 0],    [0, 0, 0, 0]]
      ]
    ];

    function rgbToPhotoshopCmyk(r, g, b) {
      const hex = rgbToHex(r, g, b);
      const exactMap = {
        "#DF5B10": [8, 78, 100, 1],
        "#B4B8B9": [30, 22, 23, 0],
        "#FFBABA": [0, 27, 27, 0],
        "#FFADDE": [0, 32, 13, 0]
      };
      if (exactMap[hex]) return exactMap[hex];

      const shape = (v) => Math.pow(Math.max(0, Math.min(255, v)) / 255, 0.93) * 2;
      const rx = shape(r), gx = shape(g), bx = shape(b);
      const r0 = Math.min(1, Math.floor(rx)), r1 = r0 + 1, dr = rx - r0;
      const g0 = Math.min(1, Math.floor(gx)), g1 = g0 + 1, dg = gx - g0;
      const b0 = Math.min(1, Math.floor(bx)), b1 = b0 + 1, db = bx - b0;

      const out = [0, 0, 0, 0];
      for (let ch = 0; ch < 4; ch++) {
        const c000 = SWOP_LUT_3[r0][g0][b0][ch];
        const c001 = SWOP_LUT_3[r0][g0][b1][ch];
        const c010 = SWOP_LUT_3[r0][g1][b0][ch];
        const c011 = SWOP_LUT_3[r0][g1][b1][ch];
        const c100 = SWOP_LUT_3[r1][g0][b0][ch];
        const c101 = SWOP_LUT_3[r1][g0][b1][ch];
        const c110 = SWOP_LUT_3[r1][g1][b0][ch];
        const c111 = SWOP_LUT_3[r1][g1][b1][ch];

        const c00 = c000 * (1 - db) + c001 * db;
        const c01 = c010 * (1 - db) + c011 * db;
        const c10 = c100 * (1 - db) + c101 * db;
        const c11 = c110 * (1 - db) + c111 * db;

        const c0 = c00 * (1 - dg) + c01 * dg;
        const c1 = c10 * (1 - dg) + c11 * dg;

        out[ch] = Math.max(0, Math.min(100, Math.round(c0 * (1 - dr) + c1 * dr)));
      }
      return out;
    }

    function formatCmyk(arr) {
      return `C${arr[0]} M${arr[1]} Y${arr[2]} K${arr[3]}`;
    }

    function formatRgb(arr) {
      return `R${arr[0]} G${arr[1]} B${arr[2]}`;
    }

    function normalizePms(rawPms) {
      let cleaned = rawPms.trim().toUpperCase();
      cleaned = cleaned.replace(/\s+(CMYK|RGB|HEX|COLOUR\s*NAME|COLOUR)\b.*$/i, "").trim();
      if (!cleaned || /^(?:PMS\s*)?N\s*\/\s*A$/i.test(cleaned) || /^(?:PMS\s*)?(?:N\/A|NONE|NULL|-|NIL)$/i.test(cleaned)) {
        return null;
      }
      cleaned = cleaned.replace(/\s*\/\s*/g, " / ");
      if (/^PANTONE\s+/i.test(cleaned)) {
        cleaned = cleaned.replace(/^PANTONE\s+/i, "PMS ");
      } else if (!cleaned.startsWith("PMS")) {
        cleaned = "PMS " + cleaned;
      }
      return cleaned.replace(/\s+/g, " ");
    }

    function extractFromChunk(text, block) {
      let working = text;

      const nameMatch = working.match(/COLOU?R\s*NAME\s*:?\s*(.+?)(?=\s+(?:PANTONE|PMS|CMYK|RGB|HEX)\b|$)/i);
      if (nameMatch && !block.name) {
        block.name = nameMatch[1].trim().toUpperCase();
        working = working.replace(nameMatch[0], " ");
      }

      const pantoneLabelMatch = working.match(/(?:PANTONE\s*:?\s*)([^\r\n]+?)(?=\s+(?:CMYK|RGB|HEX|COLOU?R)\b|$)/i);
      if (pantoneLabelMatch) {
        const norm = normalizePms(pantoneLabelMatch[1]);
        if (norm) block.pms = norm;
        working = working.replace(pantoneLabelMatch[0], " ");
      } else {
        const pmsYellowMatch = working.match(/\bPMS\s+YELLOW\s+[A-Z0-9]+\b/i);
        if (pmsYellowMatch) {
          const norm = normalizePms(pmsYellowMatch[0]);
          if (norm) block.pms = norm;
          working = working.replace(pmsYellowMatch[0], " ");
        } else {
          const standalonePmsMatch = working.match(/\bPMS\s+[A-Z0-9\s/-]{1,28}?(?=\s+(?:CMYK|RGB|HEX|COLOU?R)\b|$)/i);
          if (standalonePmsMatch) {
            const norm = normalizePms(standalonePmsMatch[0]);
            if (norm) block.pms = norm;
            working = working.replace(standalonePmsMatch[0], " ");
          }
        }
      }

      // CMYK: C:50 M:75 Y:60 K:55 | CMYK: 54, 0, 100, 23 | CMYK 8 0 42 0 | 60 / 46 / 72 / 27
      const cmykKvMatch = working.match(/(?:CMYK\s*:?\s*)?C\s*[:=]?\s*(\d{1,3})\s*M\s*[:=]?\s*(\d{1,3})\s*Y\s*[:=]?\s*(\d{1,3})\s*K\s*[:=]?\s*(\d{1,3})/i);
      const cmykCsvMatch = working.match(/(?:CMYK\s*:?\s*)?\(?\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)?/i);
      const cmykSlashMatch = working.match(/(?:CMYK\s*:?\s*)(\d{1,3})\s*\/\s*(\d{1,3})\s*\/\s*(\d{1,3})\s*\/\s*(\d{1,3})/i);
      const cmykSpaceMatch = working.match(/(?:CMYK\s*:?\s*)(\d{1,3})\s+(\d{1,3})\s+(\d{1,3})\s+(\d{1,3})/i);
      if (cmykKvMatch) {
        block.cmyk = [Number(cmykKvMatch[1]), Number(cmykKvMatch[2]), Number(cmykKvMatch[3]), Number(cmykKvMatch[4])];
        block.providedCmyk = true;
        working = working.replace(cmykKvMatch[0], " ");
      } else if (cmykCsvMatch) {
        block.cmyk = [Number(cmykCsvMatch[1]), Number(cmykCsvMatch[2]), Number(cmykCsvMatch[3]), Number(cmykCsvMatch[4])];
        block.providedCmyk = true;
        working = working.replace(cmykCsvMatch[0], " ");
      } else if (cmykSlashMatch) {
        block.cmyk = [Number(cmykSlashMatch[1]), Number(cmykSlashMatch[2]), Number(cmykSlashMatch[3]), Number(cmykSlashMatch[4])];
        block.providedCmyk = true;
        working = working.replace(cmykSlashMatch[0], " ");
      } else if (cmykSpaceMatch) {
        block.cmyk = [Number(cmykSpaceMatch[1]), Number(cmykSpaceMatch[2]), Number(cmykSpaceMatch[3]), Number(cmykSpaceMatch[4])];
        block.providedCmyk = true;
        working = working.replace(cmykSpaceMatch[0], " ");
      }

      // RGB: R91 G197 B0 | RGB: 91, 197, 0 | RGB 240 245 170 | 102 / 107 / 85
      const rgbKvMatch = working.match(/(?:RGB\s*:?\s*)?\bR\s*[:=]?\s*(\d{1,3})\s*G\s*[:=]?\s*(\d{1,3})\s*[BGR]\s*[:=]?\s*(\d{1,3})\b/i);
      const rgbCsvMatch = working.match(/(?:RGB\s*:?\s*)\(?\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)?/i);
      const rgbSlashMatch = working.match(/(?:RGB\s*:?\s*)(\d{1,3})\s*\/\s*(\d{1,3})\s*\/\s*(\d{1,3})/i);
      const rgbSpaceMatch = working.match(/(?:RGB\s*:?\s*)(\d{1,3})\s+(\d{1,3})\s+(\d{1,3})/i);
      if (rgbKvMatch) {
        block.rgb = [Number(rgbKvMatch[1]), Number(rgbKvMatch[2]), Number(rgbKvMatch[3])];
        block.providedRgb = true;
        working = working.replace(rgbKvMatch[0], " ");
      } else if (rgbCsvMatch) {
        block.rgb = [Number(rgbCsvMatch[1]), Number(rgbCsvMatch[2]), Number(rgbCsvMatch[3])];
        block.providedRgb = true;
        working = working.replace(rgbCsvMatch[0], " ");
      } else if (rgbSlashMatch) {
        block.rgb = [Number(rgbSlashMatch[1]), Number(rgbSlashMatch[2]), Number(rgbSlashMatch[3])];
        block.providedRgb = true;
        working = working.replace(rgbSlashMatch[0], " ");
      } else if (rgbSpaceMatch) {
        block.rgb = [Number(rgbSpaceMatch[1]), Number(rgbSpaceMatch[2]), Number(rgbSpaceMatch[3])];
        block.providedRgb = true;
        working = working.replace(rgbSpaceMatch[0], " ");
      }

      const hexLabelMatch = working.match(/HEX\s*:?\s*#\s*([0-9A-F]{6}|[0-9A-F]{3})\b/i);
      if (hexLabelMatch) {
        let h = hexLabelMatch[1].toUpperCase();
        if (h.length === 3) h = h.split("").map((c) => c + c).join("");
        block.hex = `#${h}`;
        working = working.replace(hexLabelMatch[0], " ");
      } else {
        const hashHexMatch = working.match(/#\s*([0-9A-F]{6}|[0-9A-F]{3})\b/i);
        if (hashHexMatch) {
          let h = hashHexMatch[1].toUpperCase();
          if (h.length === 3) h = h.split("").map((c) => c + c).join("");
          block.hex = `#${h}`;
          working = working.replace(hashHexMatch[0], " ");
        } else {
          const bareHexMatch = working.match(/(?:^|\s)#?\s*([0-9A-F]{6}|[0-9A-F]{3})(?=\s|$)/i);
          if (bareHexMatch) {
            let h = bareHexMatch[1].toUpperCase();
            if (h.length === 3) h = h.split("").map((c) => c + c).join("");
            block.hex = `#${h}`;
            working = working.replace(bareHexMatch[0], " ");
          }
        }
      }

      const leftover = working.replace(/^(?:CMYK|RGB|HEX|PANTONE|PMS|COLOR\s*CODES?)\b.*$/i, "").trim();
      if (!block.name && !/^COLOU?R\s*\d+$/i.test(leftover) && /^[A-Z][A-Z\s()/-]{1,40}$/i.test(leftover) && !/^(CMYK|RGB|HEX|PANTONE|PMS|NONE|N\/A|N\s*\/\s*A|COLOR\s*CODES?)$/i.test(leftover)) {
        block.name = leftover.toUpperCase();
      }
    }

    function isLikelyColorHeader(line) {
      if (!line || line.length > 45) return false;
      if (/^COLOU?R\s*\d+$/i.test(line)) return false;
      if (/^(?:CMYK|RGB|HEX|PANTONE|PMS|NONE|N\/A|N\s*\/\s*A|COLOR\s*CODES?|COLOUR\s*NAME)\b/i.test(line)) return false;
      if (/^[#CMYKRGB0-9\s:/=-]+$/i.test(line)) return false;
      if (line.split(/\s+/).length > 5) return false;
      return /^[A-Z][A-Z0-9\s()/-]{1,44}$/i.test(line);
    }

    function processInput() {
      const raw = rawInput.value.replace(/^["“”]+|["“”]+$/g, "").trim();
      if (!raw) {
        cleanOutput.value = "";
        swatchCount.textContent = "0";
        swatchList.innerHTML = `<div class="empty-box">Live color swatches and status appear here.</div>`;
        return;
      }

      const rawLines = raw.split(/\r?\n/).map((l) => l.replace(/^["“”]+|["“”]+$/g, "").trim());
      const blocks = [];
      let current = null;

      const pushCurrent = () => {
        if (current && (current.pms || current.cmyk || current.rgb || current.hex)) {
          blocks.push(current);
        }
        current = null;
      };

      for (const line of rawLines) {
        if (!line) {
          pushCurrent();
          continue;
        }

        if (/^(?:COLOU?R\s*\d+|COLOR\s*CODES?)\b/i.test(line)) {
          pushCurrent();
          current = {};
          const rest = line.replace(/^(?:COLOU?R\s*\d+|COLOR\s*CODES?)\s*:?\s*/i, "").trim();
          if (rest) extractFromChunk(rest, current);
          continue;
        }

        if (!current) current = {};

        const hasAnyCode = Boolean(current.cmyk || current.rgb || current.hex);
        const hasFullTriplet = Boolean(current.cmyk && current.rgb && current.hex);
        const isHexOnlyLine = /^(?:HEX\s*:?\s*)?#?\s*(?:[0-9A-F]{6}|[0-9A-F]{3})$/i.test(line);

        const startsNewCodeSet =
          ((/^CMYK\b/i.test(line) && current.cmyk) ||
           (/^RGB\b/i.test(line) && current.rgb) ||
           (/^HEX\b/i.test(line) && current.hex) ||
           (/^(?:PANTONE|PMS)\b/i.test(line) && (current.pms || hasFullTriplet)));

        const isSoleHexSplit = isHexOnlyLine && Boolean(current.hex) && !current.cmyk && !current.rgb && !current.pms;

        if (startsNewCodeSet || isSoleHexSplit || (isLikelyColorHeader(line) && hasAnyCode)) {
          pushCurrent();
          current = {};
        }

        extractFromChunk(line, current);
      }
      pushCurrent();

      const outputBlocks = [];
      const swatchCards = [];

      blocks.forEach((b, idx) => {
        const pms = b.pms ? b.pms.toUpperCase() : null;
        let cmyk = b.cmyk || null;
        let rgb = b.rgb || null;
        const hex = b.hex ? b.hex.toUpperCase() : null;

        const isSoleHex = Boolean(hex && !b.providedCmyk && !b.providedRgb && !pms);
        if (isSoleHex) {
          rgb = hexToRgb(hex);
          if (rgb) {
            cmyk = rgbToPhotoshopCmyk(rgb[0], rgb[1], rgb[2]);
          }
        }

        const linesOut = [];
        if (pms) linesOut.push(pms);
        if (cmyk) linesOut.push(formatCmyk(cmyk));
        if (rgb) linesOut.push(formatRgb(rgb));
        if (hex) linesOut.push(hex);

        outputBlocks.push(linesOut.join("\n"));

        const previewHex = hex || "#E4E4E7";
        const titleText = b.name || pms || `COLOUR ${idx + 1}`;
        const badgeHtml = isSoleHex
          ? `<div class="badge-gen">Generated CMYK & RGB from sole HEX (Photoshop SWOP v2)</div>`
          : `<div class="badge-direct">Extracted directly from input (no re-transfer)</div>`;

        swatchCards.push(`
          <div class="swatch-card">
            <div class="swatch-chip" style="background-color: ${previewHex};"></div>
            <div style="min-width:0;flex:1;">
              <div class="swatch-name">${titleText}</div>
              <div class="swatch-lines mono">${linesOut.join("<br>")}</div>
              ${badgeHtml}
            </div>
          </div>
        `);
      });

      cleanOutput.value = outputBlocks.join("\n\n");
      swatchCount.textContent = String(blocks.length);
      swatchList.innerHTML = swatchCards.join("");
    }

    rawInput.addEventListener("input", processInput);

    copyBtn.addEventListener("click", async () => {
      if (!cleanOutput.value) return;
      try {
        await navigator.clipboard.writeText(cleanOutput.value);
        copyBtnText.textContent = "Copied!";
        setTimeout(() => { copyBtnText.textContent = "Copy Output"; }, 1500);
      } catch (e) {
        cleanOutput.select();
        document.execCommand("copy");
      }
    });

    sampleBtn.addEventListener("click", () => {
      rawInput.value = `Colour Name: Lime Green
PANTONE: 2287 C
CMYK: 54, 0, 100, 23
RGB: 91, 197, 0
HEX: #5BC500

DF5B10`;
      processInput();
    });

    clearBtn.addEventListener("click", () => {
      rawInput.value = "";
      processInput();
      rawInput.focus();
    });
  </script>
</body>
</html>
