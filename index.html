  <script>
    const PMS_DB = {
      "PMS 9121 U":  { cmyk: "C0 M0 Y30 K0",   rgb: [255, 251, 199], hex: "#FFFBC7" },
      "PMS 2253 U":  { cmyk: "C25 M0 Y35 K0",  rgb: [200, 227, 189], hex: "#C8E3BD" },
      "PMS WARM GRAY 2 UC": { cmyk: "C10 M10 Y10 K15", rgb: [197, 193, 192], hex: "#C5C1C0" },
      "PMS WARM GRAY 2 C":  { cmyk: "C16 M18 Y20 K0",  rgb: [215, 210, 203], hex: "#D7D2CB" },
      "PMS WARM GRAY 2 U":  { cmyk: "C10 M10 Y10 K15", rgb: [197, 193, 192], hex: "#C5C1C0" },
      "PMS 391 C":   { cmyk: "C0 M3 Y100 K40", rgb: [178, 161, 0],   hex: "#B2A100" },
      "PMS 304 C":   { cmyk: "C34 M6 Y0 K9",   rgb: [155, 211, 221], hex: "#9BD3DD" },
      "PMS 164 C":   { cmyk: "C0 M50 Y75 K0",  rgb: [243, 150, 85],  hex: "#F39655" },
      "PMS 2635 C":  { cmyk: "C13 M21 Y0 K11", rgb: [207, 193, 214], hex: "#CFC1D6" },
      "PMS 1665 C":  { cmyk: "C0 M69 Y98 K14", rgb: [211, 95, 13],   hex: "#D35F0D" },
      "PMS 723 C":   { cmyk: "C0 M41 Y80 K30", rgb: [189, 131, 50],  hex: "#BD8332" },
      "PMS 375 C":   { cmyk: "C49 M0 Y100 K0", rgb: [152, 194, 29],  hex: "#98C21D" },
      "PMS 204 C":   { cmyk: "C5 M61 Y9 K0",   rgb: [231, 130, 169], hex: "#E782A9" },
      "PMS 1575 C":  { cmyk: "C0 M50 Y80 K0",  rgb: [243, 149, 63],  hex: "#F3953F" },
      "PMS 3935 C":  { cmyk: "C0 M4 Y62 K5",   rgb: [249, 228, 119], hex: "#F9E477" },
      "PMS 9560 C":  { cmyk: "C7 M0 Y8 K6",    rgb: [231, 237, 230], hex: "#E7EDE6" },
      "PMS 427 C":   { cmyk: "C2 M0 Y0 K17",   rgb: [220, 222, 223], hex: "#DCDEDF" }
    };

    const rawInput = document.getElementById("rawInput");
    const cleanOutput = document.getElementById("cleanOutput");
    const swatchList = document.getElementById("swatchList");
    const swatchCount = document.getElementById("swatchCount");
    const copyBtn = document.getElementById("copyBtn");
    const copyBtnText = document.getElementById("copyBtnText");
    const sampleBtn = document.getElementById("sampleBtn");
    const clearBtn = document.getElementById("clearBtn");

    function rgbToHex(r, g, b) {
      const clamp = (n) => Math.max(0, Math.min(255, Math.round(n)));
      return "#" + [clamp(r), clamp(g), clamp(b)]
        .map((x) => x.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }

    function hexToRgb(hex) {
      let clean = hex.replace(/^#/, "").trim();
      if (clean.length === 3) clean = clean.split("").map(c => c + c).join("");
      if (!/^[0-9A-Fa-f]{6}$/.test(clean)) return null;
      const num = parseInt(clean, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }

    function rgbToCmyk(r, g, b) {
      const rp = r / 255, gp = g / 255, bp = b / 255;
      const k = 1 - Math.max(rp, gp, bp);
      if (k >= 1) return [0, 0, 0, 100];
      const c = Math.round(((1 - rp - k) / (1 - k)) * 100);
      const m = Math.round(((1 - gp - k) / (1 - k)) * 100);
      const y = Math.round(((1 - bp - k) / (1 - k)) * 100);
      return [c, m, y, Math.round(k * 100)];
    }

    function cmykToRgb(c, m, y, k) {
      const cp = Math.max(0, Math.min(100, c)) / 100;
      const mp = Math.max(0, Math.min(100, m)) / 100;
      const yp = Math.max(0, Math.min(100, y)) / 100;
      const kp = Math.max(0, Math.min(100, k)) / 100;
      const r = Math.round(255 * (1 - cp) * (1 - kp));
      const g = Math.round(255 * (1 - mp) * (1 - kp));
      const b = Math.round(255 * (1 - yp) * (1 - kp));
      return [r, g, b];
    }

    function formatCmyk(arr) {
      return `C${arr[0]} M${arr[1]} Y${arr[2]} K${arr[3]}`;
    }

    function formatRgb(arr) {
      return `R${arr[0]} G${arr[1]} B${arr[2]}`;
    }

    function normalizePms(rawPms) {
      let cleaned = rawPms.trim().toUpperCase();
      // Remove trailing label words if inline (e.g., "PANTONE 9121 U CMYK:" -> "PANTONE 9121 U")
      cleaned = cleaned.replace(/\s+(CMYK|RGB|HEX|COLOUR\s*NAME|COLOUR)\b.*$/i, "").trim();
      if (!cleaned || /^(N\/A|PMS\s*N\/A|NONE|NULL|-|NIL)$/i.test(cleaned)) {
        return null;
      }
      if (/^PANTONE\s+/i.test(cleaned)) {
        cleaned = cleaned.replace(/^PANTONE\s+/i, "PMS ");
      } else if (!cleaned.startsWith("PMS")) {
        cleaned = "PMS " + cleaned;
      }
      return cleaned.replace(/\s+/g, " ");
    }

    // Extract tokens from any chunk (even if CMYK, RGB, HEX, PANTONE are all on one line)
    function extractFromChunk(text, block) {
      let working = text;

      // 1. Check Colour Name: ... (stop before PANTONE / CMYK / RGB / HEX if on same line)
      const nameMatch = working.match(/COLOU?R\s*NAME\s*:\s*(.+?)(?=\s+(?:PANTONE|PMS|CMYK|RGB|HEX)\b|$)/i);
      if (nameMatch && !block.name) {
        block.name = nameMatch[1].trim().toUpperCase();
        working = working.replace(nameMatch[0], " ");
      }

      // 2. Check PANTONE: ... or PMS ...
      const pantoneLabelMatch = working.match(/(?:PANTONE\s*:?\s*)([^\r\n]+?)(?=\s+(?:CMYK|RGB|HEX|COLOU?R)\b|$)/i);
      if (pantoneLabelMatch) {
        const norm = normalizePms(pantoneLabelMatch[1]);
        if (norm) block.pms = norm;
        working = working.replace(pantoneLabelMatch[0], " ");
      } else {
        const standalonePmsMatch = working.match(/\bPMS\s+[A-Z0-9\s-]{2,20}?(?=\s+(?:CMYK|RGB|HEX)\b|$)/i);
        if (standalonePmsMatch) {
          const norm = normalizePms(standalonePmsMatch[0]);
          if (norm) block.pms = norm;
          working = working.replace(standalonePmsMatch[0], " ");
        }
      }

      // 3. Check CMYK: C0 M0 Y30 K0 or C0 M0 Y30 K0
      const cmykMatch = working.match(/(?:CMYK\s*:?\s*)?C\s*(\d{1,3})\s*M\s*(\d{1,3})\s*Y\s*(\d{1,3})\s*K\s*(\d{1,3})/i);
      if (cmykMatch) {
        block.cmyk = [
          parseInt(cmykMatch[1], 10),
          parseInt(cmykMatch[2], 10),
          parseInt(cmykMatch[3], 10),
          parseInt(cmykMatch[4], 10)
        ];
        working = working.replace(cmykMatch[0], " ");
      }

      // 4. Check RGB: R255 G251 B199 or 255, 251, 199
      const rgbMatch = working.match(/(?:RGB\s*:?\s*)?R\s*(\d{1,3})\s*G\s*(\d{1,3})\s*B\s*(\d{1,3})/i);
      if (rgbMatch) {
        block.rgb = [
          parseInt(rgbMatch[1], 10),
          parseInt(rgbMatch[2], 10),
          parseInt(rgbMatch[3], 10)
        ];
        working = working.replace(rgbMatch[0], " ");
      } else {
        const rgbCsv = working.match(/(?:RGB\s*:?\s*)?\(?\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)?/);
        if (rgbCsv) {
          block.rgb = [
            parseInt(rgbCsv[1], 10),
            parseInt(rgbCsv[2], 10),
            parseInt(rgbCsv[3], 10)
          ];
          working = working.replace(rgbCsv[0], " ");
        }
      }

      // 5. Check HEX: #FFFBC7 or 69BD83 (with or without #)
      const hexLabelMatch = working.match(/HEX\s*:?\s*#?([0-9A-F]{6}|[0-9A-F]{3})\b/i);
      if (hexLabelMatch) {
        let h = hexLabelMatch[1].toUpperCase();
        if (h.length === 3) h = h.split("").map(c => c + c).join("");
        block.hex = `#${h}`;
        working = working.replace(hexLabelMatch[0], " ");
      } else {
        // Standalone #HEX or 6-digit hex token (avoiding PMS numbers)
        const hashHexMatch = working.match(/#([0-9A-F]{6}|[0-9A-F]{3})\b/i);
        if (hashHexMatch) {
          let h = hashHexMatch[1].toUpperCase();
          if (h.length === 3) h = h.split("").map(c => c + c).join("");
          block.hex = `#${h}`;
          working = working.replace(hashHexMatch[0], " ");
        } else {
          // Pure 6-char hex token on its own line or word boundary (must contain at least one A-F or be standalone line)
          const bareHexMatch = working.match(/(?:^|\s)([0-9A-F]{6})(?=\s|$)/i);
          if (bareHexMatch) {
            block.hex = `#${bareHexMatch[1].toUpperCase()}`;
            working = working.replace(bareHexMatch[0], " ");
          }
        }
      }
    }

    function processInput() {
      const raw = rawInput.value.replace(/^["“”]+|["“”]+$/g, "").trim();
      if (!raw) {
        cleanOutput.value = "";
        swatchCount.textContent = "0";
        swatchList.innerHTML = `
          <div class="h-full border border-dashed border-zinc-200 rounded-xl flex items-center justify-center p-6 text-center text-xs text-zinc-400">
            Live color swatches, auto-aligned conversions, and RGB/HEX checks appear here.
          </div>`;
        return;
      }

      // Split text by "Colour X" / "Color X" headers so inline multi-field lines stay grouped per colour
      const lines = raw.split(/\r?\n/).map(l => l.replace(/^["“”]+|["“”]+$/g, "").trim()).filter(Boolean);
      const blocks = [];
      let current = null;

      const pushCurrent = () => {
        if (current && (current.pms || current.cmyk || current.rgb || current.hex)) {
          blocks.push(current);
        }
        current = null;
      };

      for (const line of lines) {
        if (/^COLOU?R\s*\d+\b/i.test(line)) {
          pushCurrent();
          current = {};
          // In case specs appear on the same line after Colour 1
          const rest = line.replace(/^COLOU?R\s*\d+\b/i, "").trim();
          if (rest) extractFromChunk(rest, current);
          continue;
        }

        if (!current) current = {};

        // If a new colour's specs start while current already has CMYK/RGB/HEX and this line introduces a new CMYK/RGB/HEX or PANTONE
        const hasAnyCode = Boolean(current.cmyk || current.rgb || current.hex);
        const startsNewCodeSet = /^(?:PANTONE|PMS|CMYK|RGB|HEX)\b/i.test(line) &&
          ((/^CMYK\b/i.test(line) && current.cmyk) ||
           (/^RGB\b/i.test(line) && current.rgb) ||
           (/^HEX\b/i.test(line) && current.hex) ||
           (/^(?:PANTONE|PMS)\b/i.test(line) && (current.pms || hasAnyCode)));

        if (startsNewCodeSet) {
          pushCurrent();
          current = {};
        }

        extractFromChunk(line, current);
      }
      pushCurrent();

      const outputBlocks = [];
      const swatchCards = [];

      blocks.forEach((b, idx) => {
        const notes = [];
        let pms = b.pms || null;
        let cmyk = b.cmyk || null;
        let rgb = b.rgb || null;
        let hex = b.hex || null;

        // PMS lookup if missing conversion data
        if (pms && PMS_DB[pms]) {
          const ref = PMS_DB[pms];
          if (!cmyk) {
            cmyk = ref.cmyk.match(/\d+/g).map(Number);
            notes.push(`Matched CMYK from ${pms}`);
          }
          if (!rgb && !hex) {
            rgb = [...ref.rgb];
            hex = ref.hex;
            notes.push(`Matched RGB & HEX from ${pms}`);
          }
        }

        // Align RGB <-> HEX
        if (rgb && !hex) {
          hex = rgbToHex(rgb[0], rgb[1], rgb[2]);
          notes.push(`Generated ${hex} from RGB`);
        } else if (hex && !rgb) {
          rgb = hexToRgb(hex);
          if (rgb) notes.push(`Generated ${formatRgb(rgb)} from HEX`);
        } else if (rgb && hex) {
          const expectedHex = rgbToHex(rgb[0], rgb[1], rgb[2]);
          if (expectedHex !== hex) {
            notes.push(`HEX ${hex} → ${expectedHex} (RGB match)`);
            hex = expectedHex;
          }
        }

        // Align CMYK <-> RGB/HEX
        if (!cmyk && rgb) {
          cmyk = rgbToCmyk(rgb[0], rgb[1], rgb[2]);
          notes.push(`Generated ${formatCmyk(cmyk)} from RGB`);
        } else if (cmyk && !rgb) {
          rgb = cmykToRgb(cmyk[0], cmyk[1], cmyk[2], cmyk[3]);
          hex = rgbToHex(rgb[0], rgb[1], rgb[2]);
          notes.push(`Generated RGB & HEX from CMYK`);
        }

        // Strict chronological order: PMS -> CMYK -> RGB -> HEX (ALL CAPS, ignoring N/A / none)
        const linesOut = [];
        if (pms) linesOut.push(pms.toUpperCase());
        if (cmyk) linesOut.push(formatCmyk(cmyk));
        if (rgb) linesOut.push(formatRgb(rgb));
        if (hex) linesOut.push(hex.toUpperCase());

        outputBlocks.push(linesOut.join("\n"));

        const previewHex = hex || "#E4E4E7";
        const titleText = b.name || pms || `COLOUR ${idx + 1}`;
        const badgeHtml = notes.length > 0
          ? `<div class="mt-2 text-[11px] text-amber-700 bg-amber-50 border border-amber-200/80 rounded-md px-2 py-1 leading-snug">${notes.join(" • ")}</div>`
          : `<div class="mt-2 text-[11px] text-emerald-700 bg-emerald-50 border border-emerald-200/80 rounded-md px-2 py-0.5 inline-block">Verified & Ordered</div>`;

        swatchCards.push(`
          <div class="p-3 bg-white border border-zinc-200 rounded-xl shadow-sm flex items-start gap-3">
            <div class="w-11 h-11 rounded-lg border border-zinc-200 shrink-0 shadow-inner" style="background-color: ${previewHex};"></div>
            <div class="min-w-0 flex-1">
              <div class="text-xs font-bold text-zinc-900 truncate">${titleText}</div>
              <div class="text-[11px] mono text-zinc-600 mt-1 space-y-0.5">
                ${linesOut.map(l => `<div>${l}</div>`).join("")}
              </div>
              ${badgeHtml}
            </div>
          </div>
        `);
      });

      cleanOutput.value = outputBlocks.join("\n\n");
      swatchCount.textContent = String(blocks.length);
      swatchList.innerHTML = swatchCards.join("");
    }

    rawInput.addEventListener("input", processInput);

    copyBtn.addEventListener("click", async () => {
      if (!cleanOutput.value) return;
      try {
        await navigator.clipboard.writeText(cleanOutput.value);
        copyBtnText.textContent = "Copied!";
        copyBtn.classList.replace("bg-zinc-900", "bg-emerald-600");
        setTimeout(() => {
          copyBtnText.textContent = "Copy Output";
          copyBtn.classList.replace("bg-emerald-600", "bg-zinc-900");
        }, 1600);
      } catch (err) {
        cleanOutput.select();
        document.execCommand("copy");
      }
    });

    sampleBtn.addEventListener("click", () => {
      rawInput.value = `Colour 1
Colour Name: Butter Yellow PANTONE: Pantone 9121 U CMYK: C0 M0 Y30 K0 RGB: R255 G251 B199 HEX: #FFFBC7
Colour 2
Colour Name: Mint Green PANTONE: Pantone 2253 U CMYK: C25 M0 Y35 K0 RGB: R200 G227 B189 HEX: #C8E3BD
Colour 3
Colour Name: Soil Brown PANTONE: none
CMYK: C30 M70 Y70 K0 RGB: R187 G101 B75
                
HEX: #BB654B
Colour 4
Colour Name: Leaf Green PANTONE: none
CMYK: C60 M0 Y60 K0 RGB: R105 G189 B131 HEX: #69BD83
Colour 5
Colour Name: Diary Blue PANTONE: none
CMYK: C70 M0 Y0 K0 RGB: R0 G185 B239 HEX: #00B9EF`;
      processInput();
    });

    clearBtn.addEventListener("click", () => {
      rawInput.value = "";
      processInput();
      rawInput.focus();
    });
  </script>
</body>
</html>
